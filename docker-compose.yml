# Ambiente de desenvolvimento em uma unica maquina: as tres empresas do
# consorcio lado a lado (PROJETO_P2.md, secoes 13.3 e 12.1).
# No laboratorio NAO use este arquivo: rode `docker run` em cada maquina,
# conforme a secao 13.2 do PROJETO_P2.md.
#
# Cada empresa monta SOMENTE o seu diretorio de dados e o seu diretorio de
# estado, e nenhum volume e compartilhado entre empresas (RD07, RD11). Dentro
# do conteiner todas escutam em 9000 (clientes) e 8080 (pares); o host as
# distingue pelas portas 9001 a 9003 e 8081 a 8083 (secao 13.3).
#
# Entre conteineres, os pares se encontram pelo nome do servico
# (http://rotacapixaba:8080) e usam a porta 8080 interna, nao a publicada.
#
# LOG_OPERACOES desliga o registro de operacoes (D19) nas tres empresas ao
# mesmo tempo, e so e usada para medir:
#   LOG_OPERACOES=false docker compose up -d --force-recreate
# Com o registro ligado, cada requisicao vira uma escrita sincrona no terminal,
# e com centenas de milhares delas isso entra na latencia medida e disputa com o
# mutex do estado (PROJETO.md, secao 8.3). Para a demonstracao o registro fica
# ligado, que e o padrao: e nele que PREPARAR, votos e decisao aparecem.
#
# As tres sobem com --auditoria, que expoe GET /auditoria com o estado completo
# da empresa (secao 11.2). E instrumento de observacao, como o -race: nao
# participa de nenhuma decisao, e com ele a demonstracao pode conferir os
# contadores das tres empresas com um curl. Em producao a flag fica desligada:
# a auditoria mostra tambem as participacoes, que nenhum par tem o direito de
# ver (D32).

x-servidor: &servidor
  build:
    context: .
    dockerfile: Dockerfile.servidor
  # O log (D22) fica em ./estado/<empresa>, no host, e nao dentro do conteiner:
  # `docker compose restart` e ate `down` preservam as caronas publicadas. O
  # --user evita que o arquivo nasca com dono root (secao 13.2). Para recomecar
  # uma empresa do zero, apague o diretorio dela (D37).
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    TZ: America/Bahia

services:
  vaijunto:
    <<: *servidor
    # O merge do <<: *servidor substitui o bloco environment inteiro, por isso o
    # TZ reaparece aqui.
    #
    # FALHAR_EM (D31, secao 9.5) existe so neste servico, e vazio por padrao: a
    # demonstracao D-5 arma o ponto com
    # `FALHAR_EM=coord-apos-decidir docker compose up -d --force-recreate vaijunto`,
    # faz uma reserva e religa com `docker compose start vaijunto`, agora sem a
    # variavel. Nos outros dois servicos ela nao entra para que uma rodada
    # sabotada seja sempre de uma empresa so.
    environment:
      TZ: America/Bahia
      FALHAR_EM: "${FALHAR_EM:-}"
    command:
      - "--empresa=vaijunto"
      - "--endereco=0.0.0.0:9000"
      - "--endereco-pares=0.0.0.0:8080"
      - "--dados=/dados"
      - "--log=/estado/vaijunto.wal"
      - "--pares=rotacapixaba=http://rotacapixaba:8080,rotafluminense=http://rotafluminense:8080"
      - "--log-operacoes=${LOG_OPERACOES:-true}"
      - "--auditoria"
    ports:
      - "9001:9000"
      - "8081:8080"
    volumes:
      - ./dados/vaijunto:/dados:ro
      - ./estado/vaijunto:/estado

  rotacapixaba:
    <<: *servidor
    command:
      - "--empresa=rotacapixaba"
      - "--endereco=0.0.0.0:9000"
      - "--endereco-pares=0.0.0.0:8080"
      - "--dados=/dados"
      - "--log=/estado/rotacapixaba.wal"
      - "--pares=vaijunto=http://vaijunto:8080,rotafluminense=http://rotafluminense:8080"
      - "--log-operacoes=${LOG_OPERACOES:-true}"
      - "--auditoria"
    ports:
      - "9002:9000"
      - "8082:8080"
    volumes:
      - ./dados/rotacapixaba:/dados:ro
      - ./estado/rotacapixaba:/estado

  rotafluminense:
    <<: *servidor
    command:
      - "--empresa=rotafluminense"
      - "--endereco=0.0.0.0:9000"
      - "--endereco-pares=0.0.0.0:8080"
      - "--dados=/dados"
      - "--log=/estado/rotafluminense.wal"
      - "--pares=vaijunto=http://vaijunto:8080,rotacapixaba=http://rotacapixaba:8080"
      - "--log-operacoes=${LOG_OPERACOES:-true}"
      - "--auditoria"
    ports:
      - "9003:9000"
      - "8083:8080"
    volumes:
      - ./dados/rotafluminense:/dados:ro
      - ./estado/rotafluminense:/estado

  # Os clientes ficam no perfil "clientes" para que `docker compose up` suba so
  # as empresas. Uso (escolha a empresa pelo servico de destino):
  #   docker compose run --rm -e VAIJUNTO_SERVIDOR=rotacapixaba:9000 passageiro
  passageiro:
    profiles: ["clientes"]
    build:
      context: .
      dockerfile: Dockerfile.cliente
    entrypoint: ["/bin/passageiro"]
    environment:
      VAIJUNTO_SERVIDOR: vaijunto:9000
    stdin_open: true
    tty: true

  motorista:
    profiles: ["clientes"]
    build:
      context: .
      dockerfile: Dockerfile.cliente
    entrypoint: ["/bin/motorista"]
    environment:
      VAIJUNTO_SERVIDOR: vaijunto:9000
    stdin_open: true
    tty: true

  # O simulador de passageiros (E4, secao 11.4). Fica no mesmo perfil dos
  # clientes para que `docker compose up` suba so as empresas.
  #
  # As flags que nao mudam estao no entrypoint, e as ajustaveis no command:
  # assim `docker compose run --rm simulador <flags>` substitui o command e
  # mantem os enderecos e o diretorio de saida. Exemplos:
  #   docker compose run --rm simulador
  #   docker compose run --rm simulador --cenario=local --duracao=30s
  #   docker compose run --rm simulador --curva=1,10,50,100 --duracao=5s --rotulo=rede
  #
  # Os enderecos sao os internos (9000), e nao as portas publicadas: entre
  # conteineres as empresas se encontram pelo nome do servico. O --user evita
  # que o CSV nasca com dono root, como nos servidores.
  #
  # Terminado o simulador, as invariantes se conferem de fora, porque o
  # simulador fala so TCP (secao 11.2):
  #   VAIJUNTO_AUDITORIA=vaijunto=http://localhost:8081,rotacapixaba=http://localhost:8082,rotafluminense=http://localhost:8083 \
  #     go test -run TestInvariantesDoAmbiente ./testes
  simulador:
    profiles: ["clientes"]
    build:
      context: .
      dockerfile: Dockerfile.cliente
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: America/Bahia
    entrypoint:
      - "/bin/simulador"
      - "--empresas=vaijunto=vaijunto:9000,rotacapixaba=rotacapixaba:9000,rotafluminense=rotafluminense:9000"
      - "--saida=/resultados"
    command:
      - "--cenario=federado"
      - "--passageiros=20"
      - "--duracao=60s"
    volumes:
      - ./resultados:/resultados
